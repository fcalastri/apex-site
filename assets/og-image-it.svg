<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glow" cx="82%" cy="8%" r="60%">
      <stop offset="0%" stop-color="#2D6BFF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#2D6BFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#232C38" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="#0B0F14"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.35"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- corner marks -->
  <path d="M60 60 L60 96 M60 60 L96 60" stroke="#B8FF2C" stroke-width="3" fill="none"/>
  <path d="M1140 570 L1140 534 M1140 570 L1104 570" stroke="#B8FF2C" stroke-width="3" fill="none"/>

  <!-- wordmark -->
  <path d="M96 168 L155 168 L124 100 Z" fill="#B8FF2C" transform="translate(0,0)"/>
  <text x="150" y="196" font-family="DejaVu Sans" font-weight="bold" font-size="40" letter-spacing="14" fill="#F5F7FA">APEX</text>

  <!-- headline -->
  <text x="96" y="330" font-family="DejaVu Sans" font-weight="bold" font-size="72" fill="#F5F7FA">Migliaia di ore in moto.</text>
  <text x="96" y="410" font-family="DejaVu Sans" font-weight="bold" font-size="72" fill="#B8FF2C">Zero review.</text>

  <!-- subline -->
  <text x="96" y="466" font-family="DejaVu Sans" font-size="27" fill="#8A95A5">Ogni uscita diventa una review. Linea, frenata, gas — curva per curva.</text>

  <!-- track line motif -->
  <path d="M 96 590 C 320 590 420 572 520 538 C 620 504 760 486 1104 478" fill="none" stroke="#232C38" stroke-width="24" stroke-linecap="round"/>
  <path d="M 96 590 C 320 590 420 572 520 538 C 620 504 760 486 1104 478" fill="none" stroke="#B8FF2C" stroke-width="3.5" stroke-linecap="round" opacity="0.9"/>
</svg>
