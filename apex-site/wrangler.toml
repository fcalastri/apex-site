# APEX — Cloudflare Pages config
# NOTE: database_id is an identifier, not a credential. The only secret is
# RESEND_API_KEY, which lives in the secret store (never in this file).
name = "apex"
compatibility_date = "2026-01-01"
pages_build_output_dir = "."

[[d1_databases]]
binding = "DB"
database_name = "apex-early-access"
database_id = "REPLACE_WITH_DATABASE_ID"   # from: wrangler d1 create apex-early-access
